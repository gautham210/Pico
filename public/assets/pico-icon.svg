<svg  fill="none" viewBox="0 0 200 160" xmlns="http://www.w3.org/2000/svg">
<!-- Floating Waypoint Waves -->
<path d="M20 135 C 50 128, 70 142, 100 135 C 130 128, 150 142, 180 135" opacity="0.8" stroke="#77f3e9" stroke-dasharray="4 6" stroke-linecap="round" stroke-width="2.5"></path>
<path d="M40 145 C 70 138, 90 152, 120 145 C 145 140, 165 150, 185 145" opacity="0.6" stroke="#ffdad5" stroke-dasharray="3 5" stroke-linecap="round" stroke-width="2"></path>
<!-- Compass Ring Orbit -->
<g  style="transform-origin: 100px 75px; animation-duration: 22s;">
<circle cx="100" cy="75" r="54" stroke="#e0e9f7" stroke-dasharray="5 7" stroke-width="1.5"></circle>
<circle cx="100" cy="21" fill="#ff5b49" r="3"></circle>
<circle cx="154" cy="75" fill="#006a64" r="2.5"></circle>
</g>
<!-- Dynamic Floating Little Waypoint Pins -->
<g transform="translate(142, 38)">
<path d="M0 0 L6 10 L0 8 L-6 10 Z" fill="#ff5b49" transform="rotate(25)"></path>
<circle cx="0" cy="-2" fill="#ffffff" r="2"></circle>
</g>
<g transform="translate(42, 54)">
<circle cx="0" cy="0" fill="#77f3e9" r="5"></circle>
<circle cx="0" cy="0" fill="#006a64" r="2"></circle>
</g>
<!-- Pico Body (Arctic Tern) -->
<!-- Tail Feathers -->
<path d="M48 95 L18 108 L34 90 L16 82 L52 82 Z" fill="#131c26"></path>
<path d="M22 102 L38 92" stroke="#dae3f1" stroke-width="1"></path>
<!-- Torso -->
<ellipse cx="88" cy="80" fill="#131c26" rx="42" ry="26"></ellipse>
<!-- White Underbelly / Chest -->
<path d="M64 74 C68 96, 96 104, 118 84 C112 75, 96 70, 78 72 Z" fill="#f8f9ff"></path>
<!-- Graceful Folded Wing -->
<path d="M62 76 C76 60, 114 62, 124 74 C106 88, 78 86, 62 76 Z" fill="#ffffff" filter="drop-shadow(0 2px 3px rgba(19,28,38,0.12))"></path>
<path d="M78 72 C90 65, 112 68, 120 74" stroke="#dae3f1" stroke-linecap="round" stroke-width="1.5"></path>
<!-- Sleek Head & Cap -->
<circle cx="130" cy="62" fill="#131c26" r="16"></circle>
<path d="M120 62 C120 50, 142 50, 144 62 C142 66, 122 66, 120 62 Z" fill="#131c26"></path>
<!-- White Cheek Patch -->
<path d="M122 63 C124 71, 134 72, 138 65 C136 61, 126 60, 122 63 Z" fill="#ffffff"></path>
<!-- Eye -->
<circle cx="132" cy="60" fill="#ffffff" r="2.5"></circle>
<circle cx="132.5" cy="60" fill="#131c26" r="1.3"></circle>
<circle cx="133" cy="59.5" fill="#ffffff" r="0.4"></circle>
<!-- Distinctive Coral Beak -->
<path d="M142 60 L168 65 L143 69 Z" fill="#ff5b49"></path>
<!-- Beak Tip Highlight -->
<path d="M142 60 L156 63 L142 65 Z" fill="#b5261b"></path>
<!-- Legs & Perch / Map Scroll -->
<path d="M84 104 L84 116 L88 116" stroke="#ff5b49" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2"></path>
<path d="M96 103 L96 116 L100 116" stroke="#ff5b49" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2"></path>
<!-- Tactile Mini Map Scroll Pico Holds -->
<rect fill="#dae3f1" height="8" rx="4" width="46" x="74" y="114"></rect>
<rect fill="#ffdad5" height="4" rx="2" width="38" x="78" y="116"></rect>
</svg>